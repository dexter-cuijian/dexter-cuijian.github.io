<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>弧形导航走马灯</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: clamp(12px, 3vw, 24px);
      display: grid;
      place-items: center;
      background: #1a1a24;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .carousel {
      position: relative;
      width: min(900px, 100%);
      aspect-ratio: 9 / 5;
      min-height: 220px;
      isolation: isolate;
      overflow: hidden;
      border-radius: 32px;
      background: #281f37;
      box-shadow: 0 24px 70px #0b0b12b3;
      touch-action: pan-y pinch-zoom;
    }
    .track {
      display: flex;
      position: absolute;
      inset: 0;
      transition: transform .55s cubic-bezier(.22, 1, .36, 1);
    }
    .slide {
      flex: 0 0 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: clamp(8px, 1.5vw, 18px);
      padding-inline: 48px;
      text-align: center;
      background: radial-gradient(ellipse at center, #130d262c, transparent 76%), var(--palette);
    }
    .slide-number {
      color: #fff;
      font-size: clamp(72px, 15vw, 164px);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      line-height: .9;
      letter-spacing: -.05em;
      text-shadow: 0 2px 28px #160d2640;
    }
    .slide h2 {
      margin: 0;
      font-size: clamp(15px, 2.3vw, 22px);
      font-weight: 650;
      letter-spacing: .15em;
      text-shadow: 0 1px 6px #160d26ae;
    }
    .arc {
      position: absolute;
      right: 8px;
      top: 50%;
      width: 50px;
      height: 150px;
      transform: translateY(-50%);
    }
    .dot {
      --dot-size: 8px;
      position: absolute;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }
    .dot::before, .dot::after {
      content: "";
      grid-area: 1 / 1;
      border-radius: 50%;
      pointer-events: none;
    }
    .dot::before {
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #fff8, transparent 70%);
      opacity: 0;
      transform: scale(.6);
      transition: opacity .18s ease, transform .24s ease;
    }
    .dot::after {
      width: var(--dot-size);
      height: var(--dot-size);
      background: rgb(255 255 255 / .65);
      box-shadow: 0 0 5px #fff4, 0 0 0 1px #15102819;
      transition: transform .22s ease, background-color .22s ease;
    }
    .dot[aria-current="true"]::after { background: #fff; transform: scale(1.25); }
    .dot:is([data-preview], :focus-visible)::after { background: #fff; transform: scale(1.8); }
    .dot:is([data-preview], :focus-visible)::before { opacity: 1; transform: scale(1); }
    .dot:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    .tooltip {
      position: absolute;
      right: calc(50% + 16px);
      top: 50%;
      max-width: min(180px, 54vw);
      width: max-content;
      padding: 5px 9px;
      border: 1px solid #fff6;
      border-radius: 99px;
      background: rgb(255 255 255 / .15);
      backdrop-filter: blur(10px);
      font: var(--title-weight, 700) var(--title-size, 13px) / 1.15 system-ui, sans-serif;
      text-shadow: 0 1px 4px #160d2690;
      opacity: 0;
      transform: translate(-5px, -50%);
      transition: opacity .18s ease, transform .22s ease, font-size .12s linear;
      pointer-events: none;
    }
    .dot:is([data-preview], :focus-visible) { z-index: 1; }
    .dot:is([data-preview], :focus-visible) .tooltip { opacity: 1; transform: translate(0, -50%); }
    @media (max-width: 949px) {
      .carousel { border-radius: clamp(20px, 3.4vw, 32px); }
      .arc { width: clamp(38px, 5.3vw, 50px); height: clamp(124px, 16vw, 150px); }
      .dot { --dot-size: clamp(6px, .85vw, 8px); width: 26px; height: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .track, .dot::before, .dot::after, .tooltip { transition: none; }
    }
  </style>
</head>
<body>
  <main class="carousel" aria-label="专题走马灯" aria-roledescription="走马灯">
    <div class="track" aria-live="polite"></div>
    <nav class="arc" aria-label="选择专题"></nav>
  </main>
  <script src="carousel-palettes.js"></script>
  <script>
    const titles = ['自然风光', '城市夜景', '抽象艺术', '森林秘境', '极光幻境'];
    const carousel = document.querySelector('.carousel');
    const track = carousel.querySelector('.track');
    const arc = carousel.querySelector('.arc');
    let current = 0;
    let preview = null;
    let touchStart = null;
    let wheelDistance = 0;
    let wheelLocked = false;
    let wheelTimer;

    const slides = titles.map((title, index) => {
      const slide = document.createElement('section');
      slide.className = 'slide';
      slide.style.setProperty('--palette', carouselPalettes[index % carouselPalettes.length]);
      const number = document.createElement('span');
      number.className = 'slide-number';
      number.setAttribute('aria-hidden', 'true');
      number.textContent = String(index + 1).padStart(2, '0');
      const heading = document.createElement('h2');
      heading.textContent = title;
      slide.append(number, heading);
      track.append(slide);
      return slide;
    });

    const dots = titles.map((title, index) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot';
      dot.setAttribute('aria-label', title);
      const tooltip = document.createElement('span');
      tooltip.className = 'tooltip';
      tooltip.setAttribute('aria-hidden', 'true');
      tooltip.textContent = title;
      dot.append(tooltip);
      dot.addEventListener('click', () => show(index));
      arc.append(dot);
      return dot;
    });

    function layoutArc() {
      const { width, height } = arc.getBoundingClientRect();
      const halfSpan = Math.PI * .55 / 2;
      const radius = width * 2.2;
      const arcWidth = radius * (1 - Math.cos(halfSpan));
      const verticalFit = Math.min(1, (height / 2 - 13) / (radius * Math.sin(halfSpan)));
      const circleX = (width - arcWidth) / 2 + radius;
      dots.forEach((dot, index) => {
        const progress = dots.length === 1 ? .5 : index / (dots.length - 1);
        const angle = (progress * 2 - 1) * halfSpan;
        dot.style.left = `${circleX - radius * Math.cos(angle)}px`;
        dot.style.top = `${height / 2 + radius * Math.sin(angle) * verticalFit}px`;
      });
    }

    function show(index) {
      current = (index + dots.length) % dots.length;
      track.style.transform = `translateX(-${current * 100}%)`;
      slides.forEach((slide, i) => slide.inert = i !== current);
      dots.forEach((dot, i) => dot.setAttribute('aria-current', String(i === current)));
    }

    function clearPreview() {
      preview?.removeAttribute('data-preview');
      preview = null;
    }

    carousel.addEventListener('pointermove', event => {
      if (event.pointerType === 'touch') return;
      const next = event.target.closest('.dot');
      if (preview !== next) {
        clearPreview();
        preview = next;
        preview?.setAttribute('data-preview', '');
      }
      const bounds = arc.getBoundingClientRect();
      const mouseY = event.clientY - bounds.top;
      dots.forEach(dot => {
        const distance = Math.abs(mouseY - parseFloat(dot.style.top));
        const proximity = 1 - Math.min(distance / (bounds.height * .72), 1);
        dot.style.setProperty('--title-size', `${9 + proximity * 4}px`);
        dot.style.setProperty('--title-weight', Math.round(450 + proximity * 300));
      });
    });
    carousel.addEventListener('pointerleave', clearPreview);
    arc.addEventListener('focusin', event => {
      event.target.style.removeProperty('--title-size');
      event.target.style.removeProperty('--title-weight');
    });

    carousel.addEventListener('wheel', event => {
      if (event.ctrlKey || !event.deltaY) return;
      event.preventDefault();
      clearTimeout(wheelTimer);
      // Treat a trackpad gesture and its momentum as a single step.
      wheelTimer = setTimeout(() => {
        wheelDistance = 0;
        wheelLocked = false;
      }, 180);
      if (wheelLocked) return;
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? carousel.clientHeight : 1;
      wheelDistance += event.deltaY * unit;
      if (Math.abs(wheelDistance) < 28) return;
      show(current + Math.sign(wheelDistance));
      wheelLocked = true;
    }, { passive: false });

    carousel.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'touch' || !event.isPrimary || event.target.closest('.dot')) return;
      touchStart = { id: event.pointerId, x: event.clientX, y: event.clientY };
      carousel.setPointerCapture(event.pointerId);
    });
    carousel.addEventListener('pointerup', event => {
      if (event.pointerId !== touchStart?.id) return;
      const dx = event.clientX - touchStart.x;
      const dy = event.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy) * 1.25) show(current - Math.sign(dx));
    });
    carousel.addEventListener('lostpointercapture', event => {
      if (event.pointerId === touchStart?.id) touchStart = null;
    });

    arc.addEventListener('keydown', event => {
      const index = dots.indexOf(event.target);
      const step = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[event.key];
      if (index < 0 || !step) return;
      event.preventDefault();
      show(index + step);
      dots[current].focus();
    });

    new ResizeObserver(layoutArc).observe(arc);
    layoutArc();
    show(0);
  </script>
</body>
</html>
